// V2S application module configuration.
// Role: defines Android SDK compatibility, application identity and release build behavior.
plugins { id 'com.android.application' }

android {
    namespace 'com.v2s.player'
    compileSdk 36

    defaultConfig {
        applicationId 'com.v2s.player'
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName '1.1.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
